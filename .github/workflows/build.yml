name: Build

on:
  push:
    tags: ["v*"]
    # Tag builds can only reuse caches saved on their own tag or on main, so main compiles llama.cpp for them.
    branches: [main]
    paths: [".github/workflows/build.yml"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/build.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Compiled once per platform and cached on its own (bump the suffix after changing CMAKE_ARGS).
  LLAMA_CPP_VERSION: "0.3.37"
  WARM_CACHE_ONLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # llama-cpp-python 0.3.37 ships only an sdist, so it is compiled here; NATIVE=OFF keeps it portable.
      CMAKE_ARGS: -DGGML_METAL=on -DGGML_NATIVE=OFF
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: macos-metal-portable
      - name: Restore compiled llama.cpp
        id: llama
        uses: actions/cache/restore@v4
        with:
          path: wheels
          key: llama-cpp-python-${{ env.LLAMA_CPP_VERSION }}-macos-metal-portable
      - name: Compile llama.cpp
        if: steps.llama.outputs.cache-hit != 'true'
        run: python -m pip wheel "llama-cpp-python==$LLAMA_CPP_VERSION" --no-deps -w wheels
      - name: Save compiled llama.cpp
        if: steps.llama.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wheels
          key: ${{ steps.llama.outputs.cache-primary-key }}
      - name: Install
        if: env.WARM_CACHE_ONLY != 'true'
        run: |
          uv venv --python "$(which python)"
          uv pip install wheels/*.whl
          uv pip install ".[desktop]" pyinstaller
      - name: Build app and DMG
        if: env.WARM_CACHE_ONLY != 'true'
        run: ./packaging/build_macos.sh
      - name: Self-test
        if: env.WARM_CACHE_ONLY != 'true'
        env:
          SCREEN_TRANSLATOR_HOME: ${{ runner.temp }}/st-home
        run: '"dist/Screen Translator.app/Contents/MacOS/screen-translator" --self-test'
      - uses: actions/upload-artifact@v4
        if: env.WARM_CACHE_ONLY != 'true'
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # BACKEND_DL loads ggml-vulkan.dll at runtime, so PCs without a Vulkan driver fall back to the CPU backend.
      CMAKE_ARGS: -DGGML_VULKAN=on -DGGML_BACKEND_DL=on -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
      SCREEN_TRANSLATOR_HOME: ${{ github.workspace }}\.st-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.357.0
          cache: true
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: windows-vulkan-dl-avx2
      - name: Restore compiled llama.cpp
        id: llama
        uses: actions/cache/restore@v4
        with:
          path: wheels
          key: llama-cpp-python-${{ env.LLAMA_CPP_VERSION }}-windows-vulkan-dl-avx2
      - name: Compile llama.cpp
        if: steps.llama.outputs.cache-hit != 'true'
        run: python -m pip wheel "llama-cpp-python==$env:LLAMA_CPP_VERSION" --no-deps -w wheels
      - name: Save compiled llama.cpp
        if: steps.llama.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wheels
          key: ${{ steps.llama.outputs.cache-primary-key }}
      - name: Install
        if: env.WARM_CACHE_ONLY != 'true'
        run: |
          uv venv --python (Get-Command python).Source
          uv pip install (Get-ChildItem wheels\*.whl).FullName
          uv pip install ".[desktop]" pyinstaller
      - name: Build app
        if: env.WARM_CACHE_ONLY != 'true'
        run: .venv\Scripts\python -m PyInstaller --noconfirm --clean --distpath dist --workpath build\pyinstaller packaging\screen_translator.spec
      - name: Restore test model
        if: env.WARM_CACHE_ONLY != 'true'
        id: model
        uses: actions/cache@v4
        with:
          path: .st-home/models
          key: model-Qwen3.5-2B-Q8_0
      - name: Download test model
        if: env.WARM_CACHE_ONLY != 'true' && steps.model.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force .st-home\models | Out-Null
          curl.exe -fL --retry 3 -o .st-home\models\Qwen3.5-2B-Q8_0.gguf https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q8_0.gguf
      # The runner has no GPU but ships vulkan-1.dll, so this proves the Vulkan backend loads and falls back to the CPU.
      - name: Self-test
        if: env.WARM_CACHE_ONLY != 'true'
        run: ./packaging/windows/self_test.ps1
      - name: Build installer and zip
        if: env.WARM_CACHE_ONLY != 'true'
        run: |
          $version = .venv\Scripts\python -c "from importlib.metadata import version; print(version('screen-translator'))"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\screen-translator -DestinationPath "dist\ScreenTranslator-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        if: env.WARM_CACHE_ONLY != 'true'
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-windows-x64.zip
          if-no-files-found: error

  release:
    # v0.1.0 publishes a release; v0.1.0-rc1 publishes a prerelease, which the app's update check ignores.
    # Windows only: the macOS build stays a test download.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME%%-*}" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --prerelease --title "Screen Translator $GITHUB_REF_NAME (test build)" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Screen Translator $GITHUB_REF_NAME" --generate-notes
          fi
