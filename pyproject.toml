[project]
name = "screen-translator"
version = "0.1.0"
description = "Real-time on-screen OCR translation with rolling context, fully local, with an OBS overlay."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "mss>=9.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "platformdirs>=4.0",
    "llama-cpp-python>=0.3.37",
    "jinja2>=3.1",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "rapidocr>=3.10; sys_platform != 'darwin'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "soundcard>=0.4.6",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8"]

[project.scripts]
screen-translator = "screen_translator.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screen_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
